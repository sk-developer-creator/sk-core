<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — {{BRAND}}</title>
<meta name="description" content="The page you asked for does not exist. Browse the SK product catalog instead.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="{{THEME_COLOR_DARK}}" data-theme-color-dark="{{THEME_COLOR_DARK}}" data-theme-color-light="{{THEME_COLOR_LIGHT}}">
<link rel="icon" href="{{FAVICON_HREF}}" type="image/svg+xml">
<link rel="icon" href="{{ICON_PNG_HREF}}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{APPLE_TOUCH_ICON_HREF}}">
<link rel="stylesheet" href="{{CSS_HREF}}">
<script>
(function () {
  document.documentElement.classList.add('js');
  try {
    var stored = window.localStorage.getItem('sk-core-theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (error) { /* storage unavailable: keep the dark default */ }
})();
</script>
<script src="{{JS_HREF}}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{HOME_HREF}}">
      <span class="brand__mark" aria-hidden="true">{{BRAND_MARK}}</span>
      <span class="brand__name">{{BRAND}}<span class="brand__sub">SK product catalog</span></span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="site-nav" id="site-nav" data-nav-panel data-open="false" aria-label="Primary">
      <ul class="nav-list">
{{NAV_ITEMS}}
      </ul>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme" title="Switch to light theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main">
  <section class="error-page">
    <div class="container error-page__inner">
      <p class="error-page__code">Error 404</p>
      <h1>That page does not exist</h1>
      <p>The address you opened is not part of {{BRAND}}. Everything that is published here is listed in the product catalog.</p>
      <div class="error-page__actions">
        <a class="btn btn--primary" href="{{HOME_HREF}}">Go to the catalog</a>
        <a class="btn btn--ghost" href="{{HOME_HREF}}#products">See products</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="site-footer__bottom">
      <p>{{COPYRIGHT}}</p>
      <p>{{DOMAIN}}</p>
    </div>
  </div>
</footer>
</body>
</html>
